---
on:
  pull_request:
    paths:
      - '**/*.go'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

name: unit tests
jobs:
  # The job key names the check run the ruleset requires — "unit-tests
  # (1.26.x)", hyphenated, which is why this key is not "unit_tests" like the
  # file or "unit tests" like the workflow. See build.yaml.
  unit-tests:
    timeout-minutes: 25
    strategy:
      matrix:
        go-version: ['1.26.x']
    runs-on: ubuntu-latest
    steps:
      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
          cache: false

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Cache Go build and test cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: run unit tests
        run: make test
