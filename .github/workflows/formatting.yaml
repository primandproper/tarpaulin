---
on:
  pull_request:
    paths:
      - '**/*.go'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

name: formatting
jobs:
  golang:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.26.x']
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
          cache: true
          cache-dependency-path: go.sum

      # testdata/ holds the analyzer's fixture corpus: deliberately unformatted,
      # deliberately unparseable in places, and pinned to exact line numbers. The
      # local format scripts exclude it the same way. `gofmt -l` walks the
      # filesystem rather than Go's package wildcard, so unlike `go vet ./...` it
      # has to be told.
      - name: check formatting
        run: |
          unformatted=$(find . -type f -name '*.go' \
            -not -path './vendor/*' -not -path '*/testdata/*' -print0 |
            xargs -0 gofmt -l)

          if [ -n "${unformatted}" ]; then
            echo "::error::gofmt reports these files as unformatted:"
            echo "${unformatted}"
            exit 1
          fi
